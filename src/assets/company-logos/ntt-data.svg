  <!-- Logo NTT DATA baseado no design real -->
  <g transform="translate(15, 6)">
    <!-- NTT -->
    <text x="0" y="12" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">NTT</text>
    <!-- Separador -->
