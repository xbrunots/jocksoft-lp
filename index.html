<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JockSoft - Consultoria e Software House</title>
    <meta name="description" content="Especialistas em desenvolvimento mobile e soluções de IA. Transformamos suas ideias em produtos digitais inovadores." />
    
    <!-- Critical CSS to prevent white flash -->
    <style>
      html, body {
        background-color: #ffffff;
        margin: 0;
        padding: 0;
      }
      
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #0d1117 !important;
        color: #f0f6fc !important;
      }
      
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), 
        html:not([data-theme="light"]) body {
          background-color: #0d1117 !important;
          color: #f0f6fc !important;
        }
      }
    </style>
    
    <!-- Prevent flash of white content -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
          
          // Aplica o tema imediatamente
          document.documentElement.setAttribute('data-theme', theme);
          
          // Força o background escuro se necessário
          if (theme === 'dark') {
            document.documentElement.style.backgroundColor = '#0d1117';
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.backgroundColor = '#ffffff';
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          // Fallback para preferência do sistema
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#0d1117';
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
